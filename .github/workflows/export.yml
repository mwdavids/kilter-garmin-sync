name: Export Kilter activities

# Runs the exporter on a GitHub-hosted runner, which can reach the new Kilter
# backend (kiltergrips.com) even when your local corporate network (e.g.
# Microsoft Global Secure Access) TLS-blocks it or throttles the sync stream.
# The generated .fit/.tcx files are published as a build artifact for you to
# download and import into Garmin Connect manually.
#
# The "diagnose" mode is a Phase-1 investigation aid: it enumerates the
# object_types the backend syncs into your account (user_buckets) so we can
# confirm ascents are present. It writes no activity files.

on:
  schedule:
    # 13:00 UTC = ~06:00 America/Los_Angeles. A scheduled run always exports
    # FIT bouldering in America/Los_Angeles and auto-uploads new sessions.
    - cron: "0 13 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: What to run
        type: choice
        options:
          - export
          - diagnose
        default: export
      format:
        description: "[export] Output file format"
        type: choice
        options:
          - fit
          - tcx
        default: fit
      since:
        description: "[export] Only export sessions on or after this date (YYYY-MM-DD, optional)"
        type: string
        required: false
        default: ""
      sub_sport:
        description: "[export] FIT climbing sub-sport (ignored for TCX)"
        type: choice
        options:
          - bouldering
          - indoor_climbing
        default: bouldering
      tz:
        description: "[export] IANA timezone for local-day grouping (e.g. America/Los_Angeles)"
        type: string
        required: false
        default: "America/Los_Angeles"
      upload:
        description: "[export] Also auto-upload to Garmin Connect (needs GARMIN_TOKEN secret)"
        type: boolean
        default: false
      weight_lb:
        description: "[export] Body weight in lb for calorie estimates (optional)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .

      - name: Diagnose user_buckets
        if: ${{ inputs.mode == 'diagnose' }}
        env:
          KILTER_USERNAME: ${{ secrets.KILTER_USERNAME }}
          KILTER_PASSWORD: ${{ secrets.KILTER_PASSWORD }}
        run: |
          mkdir -p diag
          python -m kilter_garmin_sync.diagnose --json-out diag/user-buckets.json

      - name: Upload diagnostics
        if: ${{ inputs.mode == 'diagnose' }}
        uses: actions/upload-artifact@v4
        with:
          name: kilter-diagnostics
          path: diag/**
          if-no-files-found: warn

      - name: Compute ledger cache date
        if: ${{ inputs.mode != 'diagnose' }}
        id: ledger_date
        run: echo "date=$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Restore export ledger
        if: ${{ inputs.mode != 'diagnose' }}
        uses: actions/cache@v4
        with:
          # Carries the de-duplication ledgers across runs so already-exported
          # session days (and already-uploaded files) are skipped even on a
          # fresh runner. The key is date-based (stable, not the run id or a
          # content hash) so it persists night to night: each new day writes a
          # fresh immutable entry, and restore-keys pulls the most recent prior
          # ledger so the upload history keeps growing across nightly runs.
          path: |
            data/exported.json
            data/uploaded.json
          key: kilter-ledger-${{ steps.ledger_date.outputs.date }}
          restore-keys: |
            kilter-ledger-

      - name: Export sessions
        if: ${{ inputs.mode != 'diagnose' }}
        env:
          KILTER_USERNAME: ${{ secrets.KILTER_USERNAME }}
          KILTER_PASSWORD: ${{ secrets.KILTER_PASSWORD }}
          # Only used when upload is enabled. Mint it once locally with
          # 'kilter-garmin-sync garmin-login' and store it as this secret.
          GARMIN_TOKEN: ${{ secrets.GARMIN_TOKEN }}
          # Effective settings: each falls back from the workflow_dispatch input
          # to the scheduled default (inputs.* are empty on a schedule event).
          FORMAT: ${{ inputs.format || 'fit' }}
          SUB_SPORT: ${{ inputs.sub_sport || 'bouldering' }}
          TZ_NAME: ${{ inputs.tz || 'America/Los_Angeles' }}
          WEIGHT_LB: ${{ inputs.weight_lb }}
          SINCE_INPUT: ${{ inputs.since }}
          # De-dup floor for auto-upload: the user already imported everything on
          # or before 2026-09-23, so only export/upload sessions from this date on.
          UPLOAD_SINCE: ${{ vars.UPLOAD_SINCE || '2026-09-24' }}
          # Upload on every scheduled run; on manual runs honor the checkbox.
          UPLOAD: ${{ (github.event_name == 'schedule' || inputs.upload) && 'true' || 'false' }}
        run: |
          args=(--format "$FORMAT" --sub-sport "$SUB_SPORT" --tz "$TZ_NAME" --out out)
          # A manual run uses its own 'since' if given; otherwise (and always on a
          # schedule) apply the UPLOAD_SINCE floor so we never re-touch old sessions.
          SINCE="${SINCE_INPUT:-$UPLOAD_SINCE}"
          if [ -n "$SINCE" ]; then
            args+=(--since "$SINCE")
          fi
          if [ -n "$WEIGHT_LB" ]; then
            args+=(--weight-lb "$WEIGHT_LB")
          fi
          if [ "$UPLOAD" = "true" ]; then
            args+=(--upload)
          fi
          kilter-garmin-sync "${args[@]}" --verbose

      - name: Upload activity files
        if: ${{ inputs.mode != 'diagnose' }}
        uses: actions/upload-artifact@v4
        with:
          name: kilter-activities
          path: out/**
          if-no-files-found: warn
